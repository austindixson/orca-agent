name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-13
            platform: darwin
            arch: x86_64
          - os: macos-14
            platform: darwin
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        shell: bash
        run: |
          cargo build -p orca-cli --release
          if grep -q '"crates/orca-daemon"' Cargo.toml 2>/dev/null; then
            cargo build -p orca-daemon --release
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="orca-agent-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR"
          cp target/release/orca "$PKG_DIR/"
          if [ -f target/release/orcad ]; then
            cp target/release/orcad "$PKG_DIR/"
          fi
          cp README.md "$PKG_DIR/README.md"
          tar -czf "${PKG_DIR}.tar.gz" "$PKG_DIR"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = "orca-agent-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          Copy-Item "target/release/orca.exe" "$pkgDir/orca.exe"
          if (Test-Path "target/release/orcad.exe") {
            Copy-Item "target/release/orcad.exe" "$pkgDir/orcad.exe"
          }
          Copy-Item "README.md" "$pkgDir/README.md"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "${pkgDir}.zip"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: orca-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: orca-agent-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: orca-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: orca-agent-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Upload release assets (tag pushes)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: orca-agent-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

      - name: Upload release assets (tag pushes, windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: orca-agent-${{ matrix.platform }}-${{ matrix.arch }}.zip
